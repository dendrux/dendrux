\* Safety, recovery episodes: a progress write resets reclaim_attempts, so a run
\* can be marked and reclaimed again. Two workers, one canceller, no pauses.
SPECIFICATION SafetySpec
CONSTANTS
    Workers = {w1, w2}
    Cancellers = {k1}
    Root = root
    Kids = {c1, c2}
    SingleCallKids = {c2}
    NoWorker = NoWorker
    NoRun = NoRun
    NoCand = NoCand
    MaxParallel = 2
    ReclaimLimit = 1
    MaxResets = 1
    PauseKinds = {"waiting"}
    PauseRuns = {c1}
    MaxPauses = 0
    MaxCrashes = 0
    MaxCancelCrashes = 0
    IncompleteScan = FALSE
    CancelRetried = TRUE
    BugCancelRunning = FALSE
    BugSweepNoBump = FALSE
    BugFinalizeNoEpoch = FALSE
    BugPauseIgnoresCancel = FALSE
    BugBindIgnoresCancel = FALSE
SYMMETRY WorkerSymmetry
INVARIANTS
    TypeOK
    SingleWriter
    StaleOwnerFenced
    StaleWriteFails
    NoCancellerFinalizesRunning
    OrphanWindow
PROPERTIES
    TerminalFinal
    RequestKept
CHECK_DEADLOCK FALSE
