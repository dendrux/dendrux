\* Liveness: fan-out of two children, worker and canceller crashes with retry,
\* no pauses. TLC checks liveness without symmetry, so these configs are small.
SPECIFICATION Spec
CONSTANTS
    Workers = {w1}
    Cancellers = {k1}
    Root = root
    Kids = {c1, c2}
    SingleCallKids = {c2}
    NoWorker = NoWorker
    NoRun = NoRun
    NoCand = NoCand
    MaxParallel = 2
    ReclaimLimit = 1
    MaxResets = 0
    PauseKinds = {"waiting"}
    PauseRuns = {root, c1, c2}
    MaxPauses = 0
    MaxCrashes = 1
    MaxCancelCrashes = 1
    IncompleteScan = FALSE
    CancelRetried = TRUE
    BugCancelRunning = FALSE
    BugSweepNoBump = FALSE
    BugFinalizeNoEpoch = FALSE
    BugPauseIgnoresCancel = FALSE
    BugBindIgnoresCancel = FALSE
INVARIANTS
    TypeOK
    SingleWriter
    StaleOwnerFenced
    StaleWriteFails
    NoCancellerFinalizesRunning
    OrphanWindow
PROPERTIES
    TerminalFinal
    RequestKept
    CancelLeadsToTerminal
    CrashedOwnerRecovered
    OrphansSettle
CHECK_DEADLOCK FALSE
