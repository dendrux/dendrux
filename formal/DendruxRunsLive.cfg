\* Liveness check of the real design under the fairness in Spec: fan-out of two
\* children, crashes and cancel retries, no pauses. DendruxRunsLivePauses.cfg covers
\* pauses. TLC checks liveness without symmetry, so these configs are small.
SPECIFICATION Spec
CONSTANTS
    Workers = {w1}
    Cancellers = {k1}
    Root = root
    Kids = {c1, c2}
    SingleCallKids = {c2}
    NoWorker = NoWorker
    NoRun = NoRun
    MaxParallel = 2
    ReclaimLimit = 1
    MaxPauses = 0
    MaxCrashes = 1
    MaxCancelCrashes = 1
    CancelRetried = TRUE
    BugCancelRunning = FALSE
    BugSweepNoBump = FALSE
    BugFinalizeNoEpoch = FALSE
    BugPauseIgnoresCancel = FALSE
    BugBindIgnoresCancel = FALSE
PROPERTIES
    CancelLeadsToTerminal
    CrashedOwnerRecovered
    OrphansSettle
CHECK_DEADLOCK FALSE
