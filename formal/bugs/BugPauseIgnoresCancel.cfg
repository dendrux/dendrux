\* Bug variant: the owner's pause CAS ignores cancel_requested.
\* TLC must report a violation (see formal/README.md). StaleOwnerFenced is left out
\* so the trace ends at the bad write itself, not at the state that allows it.
SPECIFICATION SafetySpec
CONSTANTS
    Workers = {w1, w2}
    Cancellers = {k1}
    Root = root
    Kids = {c1, c2}
    SingleCallKids = {c2}
    NoWorker = NoWorker
    NoRun = NoRun
    MaxParallel = 2
    ReclaimLimit = 1
    MaxPauses = 1
    MaxCrashes = 1
    MaxCancelCrashes = 1
    CancelRetried = TRUE
    BugCancelRunning = FALSE
    BugSweepNoBump = FALSE
    BugFinalizeNoEpoch = FALSE
    BugPauseIgnoresCancel = TRUE
    BugBindIgnoresCancel = FALSE
INVARIANTS
    TypeOK
    SingleWriter
    StaleWriteFails
    NoCancellerFinalizesRunning
    OrphanWindow
PROPERTIES
    TerminalFinal
    RequestKept
CHECK_DEADLOCK FALSE
