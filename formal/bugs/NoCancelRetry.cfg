\* Liveness without the retry assumption: a crashed cancel_run is not called again.
\* TLC must report that CancelLeadsToTerminal is violated (see formal/README.md).
SPECIFICATION Spec
CONSTANTS
    Workers = {w1}
    Cancellers = {k1}
    Root = root
    Kids = {c1, c2}
    SingleCallKids = {c2}
    NoWorker = NoWorker
    NoRun = NoRun
    MaxParallel = 2
    ReclaimLimit = 1
    MaxPauses = 0
    MaxCrashes = 1
    MaxCancelCrashes = 1
    CancelRetried = FALSE
    BugCancelRunning = FALSE
    BugSweepNoBump = FALSE
    BugFinalizeNoEpoch = FALSE
    BugPauseIgnoresCancel = FALSE
    BugBindIgnoresCancel = FALSE
PROPERTIES
    CancelLeadsToTerminal
CHECK_DEADLOCK FALSE
