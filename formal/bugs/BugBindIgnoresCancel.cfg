\* Bug variant: the child bind ignores the parent's cancel mark.
\* TLC must report a violation (see formal/README.md). StaleOwnerFenced is left out
\* so the trace ends at the bad write itself, not at the state that allows it.
SPECIFICATION SafetySpec
CONSTANTS
    Workers = {w1, w2}
    Cancellers = {k1}
    Root = root
    Kids = {c1, c2}
    SingleCallKids = {c2}
    NoWorker = NoWorker
    NoRun = NoRun
    NoCand = NoCand
    MaxParallel = 2
    ReclaimLimit = 1
    MaxResets = 0
    PauseKinds = {"waiting"}
    PauseRuns = {root, c1, c2}
    MaxPauses = 1
    MaxCrashes = 0
    MaxCancelCrashes = 0
    IncompleteScan = FALSE
    CancelRetried = TRUE
    BugCancelRunning = FALSE
    BugSweepNoBump = FALSE
    BugFinalizeNoEpoch = FALSE
    BugPauseIgnoresCancel = FALSE
    BugBindIgnoresCancel = TRUE
INVARIANTS
    TypeOK
    SingleWriter
    StaleWriteFails
    NoCancellerFinalizesRunning
    OrphanWindow
PROPERTIES
    TerminalFinal
    RequestKept
CHECK_DEADLOCK FALSE
