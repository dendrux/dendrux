\* Reachability probe ProbeLateCancelWins (see DendruxRuns.tla). TLC must report it violated:
\* the counterexample is the witness that the behavior is reachable.
SPECIFICATION SafetySpec
CONSTANTS
    Workers = {w1}
    Cancellers = {k1}
    Root = root
    Kids = {c1, c2}
    SingleCallKids = {c2}
    NoWorker = NoWorker
    NoRun = NoRun
    NoCand = NoCand
    MaxParallel = 2
    ReclaimLimit = 1
    MaxResets = 1
    PauseKinds = {"waiting", "paused"}
    PauseRuns = {c1}
    MaxPauses = 1
    MaxCrashes = 0
    MaxCancelCrashes = 0
    IncompleteScan = TRUE
    CancelRetried = TRUE
    BugCancelRunning = FALSE
    BugSweepNoBump = FALSE
    BugFinalizeNoEpoch = FALSE
    BugPauseIgnoresCancel = FALSE
    BugBindIgnoresCancel = FALSE
PROPERTY
    ProbeLateCancelWins
CHECK_DEADLOCK FALSE
