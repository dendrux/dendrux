\* Liveness with a recovery episode: a progress write resets reclaim_attempts.
\* One ReAct child, no pauses, crashes and cancel retries.
SPECIFICATION Spec
CONSTANTS
    Workers = {w1}
    Cancellers = {k1}
    Root = root
    Kids = {c1}
    SingleCallKids = {}
    NoWorker = NoWorker
    NoRun = NoRun
    NoCand = NoCand
    MaxParallel = 2
    ReclaimLimit = 1
    MaxResets = 1
    PauseKinds = {"waiting"}
    PauseRuns = {root, c1}
    MaxPauses = 0
    MaxCrashes = 1
    MaxCancelCrashes = 1
    IncompleteScan = FALSE
    CancelRetried = TRUE
    BugCancelRunning = FALSE
    BugSweepNoBump = FALSE
    BugFinalizeNoEpoch = FALSE
    BugPauseIgnoresCancel = FALSE
    BugBindIgnoresCancel = FALSE
INVARIANTS
    TypeOK
    SingleWriter
    StaleOwnerFenced
    StaleWriteFails
    NoCancellerFinalizesRunning
    OrphanWindow
PROPERTIES
    TerminalFinal
    RequestKept
    CancelLeadsToTerminal
    CrashedOwnerRecovered
    OrphansSettle
CHECK_DEADLOCK FALSE
