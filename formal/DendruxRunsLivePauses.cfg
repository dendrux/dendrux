\* Liveness with pauses: one ReAct child, one pause per run (resume, cancel of a
\* paused run, abandoned sweep, late owner cancel), crashes and cancel retries.
SPECIFICATION Spec
CONSTANTS
    Workers = {w1}
    Cancellers = {k1}
    Root = root
    Kids = {c1}
    SingleCallKids = {}
    NoWorker = NoWorker
    NoRun = NoRun
    NoCand = NoCand
    MaxParallel = 2
    ReclaimLimit = 1
    MaxResets = 0
    PauseKinds = {"waiting", "paused"}
    PauseRuns = {root, c1}
    MaxPauses = 1
    MaxCrashes = 1
    MaxCancelCrashes = 1
    IncompleteScan = FALSE
    CancelRetried = TRUE
    BugCancelRunning = FALSE
    BugSweepNoBump = FALSE
    BugFinalizeNoEpoch = FALSE
    BugPauseIgnoresCancel = FALSE
    BugBindIgnoresCancel = FALSE
INVARIANTS
    TypeOK
    SingleWriter
    StaleOwnerFenced
    StaleWriteFails
    NoCancellerFinalizesRunning
    OrphanWindow
PROPERTIES
    TerminalFinal
    RequestKept
    CancelLeadsToTerminal
    CrashedOwnerRecovered
    OrphansSettle
CHECK_DEADLOCK FALSE
