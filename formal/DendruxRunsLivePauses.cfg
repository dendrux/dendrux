\* Liveness check of the real design with pauses: one ReAct child, one pause per
\* run (resume, cancel of a paused run, abandoned sweep), crashes and cancel retries.
SPECIFICATION Spec
CONSTANTS
    Workers = {w1}
    Cancellers = {k1}
    Root = root
    Kids = {c1}
    SingleCallKids = {}
    NoWorker = NoWorker
    NoRun = NoRun
    MaxParallel = 2
    ReclaimLimit = 1
    MaxPauses = 1
    MaxCrashes = 1
    MaxCancelCrashes = 1
    CancelRetried = TRUE
    BugCancelRunning = FALSE
    BugSweepNoBump = FALSE
    BugFinalizeNoEpoch = FALSE
    BugPauseIgnoresCancel = FALSE
    BugBindIgnoresCancel = FALSE
PROPERTIES
    CancelLeadsToTerminal
    CrashedOwnerRecovered
    OrphansSettle
CHECK_DEADLOCK FALSE
