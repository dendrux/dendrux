\* Safety with two concurrent cancel_run calls (mixed Agent and module callers).
\* One worker and no crashes, to keep the run short: DendruxRuns.cfg covers two
\* workers and crashes with one canceller.
SPECIFICATION SafetySpec
CONSTANTS
    Workers = {w1}
    Cancellers = {k1, k2}
    Root = root
    Kids = {c1, c2}
    SingleCallKids = {c2}
    NoWorker = NoWorker
    NoRun = NoRun
    MaxParallel = 2
    ReclaimLimit = 1
    MaxPauses = 1
    MaxCrashes = 0
    MaxCancelCrashes = 0
    CancelRetried = TRUE
    BugCancelRunning = FALSE
    BugSweepNoBump = FALSE
    BugFinalizeNoEpoch = FALSE
    BugPauseIgnoresCancel = FALSE
    BugBindIgnoresCancel = FALSE
SYMMETRY WorkerSymmetry
INVARIANTS
    TypeOK
    SingleWriter
    StaleOwnerFenced
    StaleWriteFails
    NoCancellerFinalizesRunning
    OrphanWindow
PROPERTIES
    TerminalFinal
    RequestKept
CHECK_DEADLOCK FALSE
