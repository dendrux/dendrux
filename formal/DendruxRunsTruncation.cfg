\* Safety, incomplete cancel traversal: a cascade may cover only some children
\* (max_nodes truncation or a skipped corrupt header). One worker, one pause per run.
SPECIFICATION SafetySpec
CONSTANTS
    Workers = {w1}
    Cancellers = {k1}
    Root = root
    Kids = {c1, c2}
    SingleCallKids = {c2}
    NoWorker = NoWorker
    NoRun = NoRun
    NoCand = NoCand
    MaxParallel = 2
    ReclaimLimit = 1
    MaxResets = 0
    PauseKinds = {"waiting"}
    PauseRuns = {c1}
    MaxPauses = 1
    MaxCrashes = 0
    MaxCancelCrashes = 0
    IncompleteScan = TRUE
    CancelRetried = TRUE
    BugCancelRunning = FALSE
    BugSweepNoBump = FALSE
    BugFinalizeNoEpoch = FALSE
    BugPauseIgnoresCancel = FALSE
    BugBindIgnoresCancel = FALSE
INVARIANTS
    TypeOK
    SingleWriter
    StaleOwnerFenced
    StaleWriteFails
    NoCancellerFinalizesRunning
    OrphanWindow
PROPERTIES
    TerminalFinal
    RequestKept
CHECK_DEADLOCK FALSE
