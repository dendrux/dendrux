\* Safety, core: two workers, one canceller, one pause per run (WAITING_* or a
\* requested PAUSED), full cancel traversal. No crash bound is needed for safety:
\* a crashed task is a task that never acts again (formal/README.md).
SPECIFICATION SafetySpec
CONSTANTS
    Workers = {w1, w2}
    Cancellers = {k1}
    Root = root
    Kids = {c1, c2}
    SingleCallKids = {c2}
    NoWorker = NoWorker
    NoRun = NoRun
    NoCand = NoCand
    MaxParallel = 2
    ReclaimLimit = 1
    MaxResets = 0
    PauseKinds = {"waiting"}
    PauseRuns = {c1}
    MaxPauses = 1
    MaxCrashes = 0
    MaxCancelCrashes = 0
    IncompleteScan = FALSE
    CancelRetried = TRUE
    BugCancelRunning = FALSE
    BugSweepNoBump = FALSE
    BugFinalizeNoEpoch = FALSE
    BugPauseIgnoresCancel = FALSE
    BugBindIgnoresCancel = FALSE
SYMMETRY WorkerSymmetry
INVARIANTS
    TypeOK
    SingleWriter
    StaleOwnerFenced
    StaleWriteFails
    NoCancellerFinalizesRunning
    OrphanWindow
PROPERTIES
    TerminalFinal
    RequestKept
CHECK_DEADLOCK FALSE
