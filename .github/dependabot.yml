version: 2
updates:
  # Library dependencies and dev tools (packages/python/pyproject.toml).
  # ruff is pinned exactly and mirrored in .pre-commit-config.yaml: bump both together.
  - package-ecosystem: pip
    directory: /packages/python
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-tools:
        patterns: [pytest*, mypy, ruff, types-*, build, twine, python-dotenv]
      runtime-minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: [pytest*, mypy, ruff, types-*, build, twine, python-dotenv]

  # Workflow actions are pinned to commit SHAs; Dependabot keeps them current
  # and rewrites the trailing version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns: ["*"]
