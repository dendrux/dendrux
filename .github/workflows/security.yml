name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pip-audit:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Audit what a user gets from `pip install dendrux[all]`, in a clean
      # environment so dev tooling is not mixed into the result.
      - name: Install the package and the audit tool
        run: |
          python -m venv "$RUNNER_TEMP/target"
          # The bundled pip is audited too; start from the current one.
          "$RUNNER_TEMP/target/bin/pip" install --upgrade pip
          "$RUNNER_TEMP/target/bin/pip" install "./packages/python[all]"
          python -m venv "$RUNNER_TEMP/tool"
          "$RUNNER_TEMP/tool/bin/pip" install "pip-audit==2.10.1"

      - name: Audit
        run: |
          # What was installed, from the environment that is audited.
          "$RUNNER_TEMP/target/bin/python" -m pip list --format=json > "$RUNNER_TEMP/inventory.json"
          status=0
          "$RUNNER_TEMP/tool/bin/pip-audit" \
            --path "$RUNNER_TEMP"/target/lib/python3.12/site-packages \
            --format json --output "$RUNNER_TEMP/audit.json" --progress-spinner off || status=$?
          echo "pip-audit exit status: $status"
          python .github/scripts/audit_gate.py "$RUNNER_TEMP/audit.json" \
            .github/pip-audit-allowlist.json "$RUNNER_TEMP/inventory.json" "$status"
