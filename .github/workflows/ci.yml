name: CI

on:
  push:
    # Feature and track branches get the full matrix on every push, so heavy runs happen
    # here instead of on a developer machine. Never push unreleased security fixes.
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # The test suite is split into four shards by test file (tools/test_tiers.py shard: a
  # deterministic, time-balanced split; `make test-shard-proof` checks it is a disjoint cover).
  # Each shard measures coverage into its own data file; the python-coverage job below combines
  # the four files of a leg and applies the coverage floor and the CRAP ratchet to the whole.
  # Lint, types, architecture and the distribution smoke test run once per leg, on shard 1.
  python:
    name: python ${{ matrix.python-version }} / SQLAlchemy ${{ matrix.sqlalchemy-version }} / shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        # pyproject allows sqlalchemy>=2.0,<3.0: test both minors. 2.1 on every
        # Python, 2.0 on the oldest and newest only (5 jobs).
        sqlalchemy-version: ["2.0.*", "2.1.*"]
        shard: [1, 2, 3, 4]
        exclude:
          - python-version: "3.12"
            sqlalchemy-version: "2.0.*"

    services:
      # Postgres backend matrix — integration tests parametrize across
      # [sqlite, postgres] via the DENDRUX_TEST_PG_URL env var. Without
      # this service the PG branch is skipped (locally fine, in CI not
      # acceptable — that's how the original tz-naive bug shipped). The
      # "Require the Postgres backend" and "Test" steps below fail the job if
      # the variable goes missing or any test is skipped for lack of it.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dendrux
          POSTGRES_PASSWORD: dendrux
          POSTGRES_DB: dendrux_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dendrux"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Real Redis for the RedisUpdates tests (Pub/Sub only; the tests use a private channel
      # each). The "Require the Redis backend" and "Test" steps fail the job if the variable
      # goes missing or those tests are skipped for lack of it.
      redis:
        image: redis:7@sha256:b6b6e3dc0c0952737748e55d5d885272840c7e42ba41ab1d5489f693419882f5
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHON_DOTENV_DISABLED: "1"
      DENDRUX_TEST_PG_URL: postgresql+asyncpg://dendrux:dendrux@localhost:5432/dendrux_test
      DENDRUX_TEST_REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/python/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev,all]"

      # Presidio loads this model by default. Install it once before workers.
      - name: Install pinned NLP test model
        run: make test-model-install

      - name: Pin SQLAlchemy ${{ matrix.sqlalchemy-version }}
        run: |
          pip install "sqlalchemy[asyncio]==${{ matrix.sqlalchemy-version }}"
          python -c "import sqlalchemy; print('SQLAlchemy', sqlalchemy.__version__)"

      - name: Lint
        if: matrix.shard == 1
        run: ruff check .

      - name: Format check
        if: matrix.shard == 1
        run: ruff format --check .

      - name: Type check
        if: matrix.shard == 1
        run: mypy src/dendrux/

      - name: Architecture rules
        if: matrix.shard == 1
        run: lint-imports

      - name: Require the Postgres backend
        shell: bash
        run: |
          if [ -z "${DENDRUX_TEST_PG_URL:-}" ]; then
            echo "::error::DENDRUX_TEST_PG_URL is not set; the Postgres test matrix would be skipped silently."
            exit 1
          fi

      - name: Require the Redis backend
        shell: bash
        run: |
          if [ -z "${DENDRUX_TEST_REDIS_URL:-}" ]; then
            echo "::error::DENDRUX_TEST_REDIS_URL is not set; the Redis integration tests would be skipped silently."
            exit 1
          fi

      - name: Test
        shell: bash
        env:
          COVERAGE_FILE: cov-${{ matrix.shard }}.data
        run: |
          # This shard's test files; every file is in exactly one of the four shards.
          files=$(python tools/test_tiers.py shard --count 4 --index ${{ matrix.shard }})
          # Benchmarks (marked benchmark) depend on the machine; `make bench` runs them.
          pytest $files -v -rs -n auto -m "not benchmark" --cov=src/dendrux --cov-report= | tee pytest.log
          if grep -Eq '^SKIPPED \[[0-9]+\].*DENDRUX_TEST_PG_URL not set' pytest.log; then
            echo "::error::Postgres integration tests were skipped (DENDRUX_TEST_PG_URL not set)."
            exit 1
          fi
          if grep -Eq '^SKIPPED \[[0-9]+\].*DENDRUX_TEST_REDIS_URL not set' pytest.log; then
            echo "::error::Redis integration tests were skipped (DENDRUX_TEST_REDIS_URL not set)."
            exit 1
          fi

      # The kit's live-update contract on Postgres: serial, on a private database the conformance
      # harness is told to authorise (it drops and recreates that database's schema). It needs the
      # stores to take live_updates= (track A2); without it every live contract skips and the guard
      # below fails the job on purpose.
      - name: Store kit live-update contract on Postgres
        if: matrix.shard == 1 && matrix.python-version == '3.12' && matrix.sqlalchemy-version == '2.1.*'
        shell: bash
        env:
          DENDRUX_TEST_PG_URL: postgresql+asyncpg://dendrux:dendrux@localhost:5432/dendrux_ci_kit_test
          DENDRUX_CONFORMANCE_PG_DB: dendrux_ci_kit_test
        run: |
          pytest tests/conformance/test_store_kit.py -k "test_live_ and postgres" -n 0 --no-cov -v -rs -p no:randomly | tee kit-live.log
          passed=$(grep -c ' PASSED' kit-live.log || true)
          if [ "$passed" -lt 7 ] || grep -Eq '^SKIPPED \[|^=+ .*[0-9]+ skipped|^[[:space:]]*live updates: not tested|^=+ .*no tests ran' kit-live.log; then
            echo "::error::The live-update kit contract must pass 7 times on Postgres and skip never (got $passed passed)."
            exit 1
          fi

      - name: Storage-format conformance on SQLite and Postgres
        if: matrix.shard == 1 && matrix.python-version == '3.12' && matrix.sqlalchemy-version == '2.1.*'
        shell: bash
        env:
          DENDRUX_TEST_PG_URL: postgresql+asyncpg://dendrux:dendrux@localhost:5432/dendrux_ci_formats_test
          DENDRUX_CONFORMANCE_PG_DB: dendrux_ci_formats_test
        run: |
          pytest tests/conformance/test_conformance.py tests/conformance/test_format2.py -n 0 --no-cov -v -rs -p no:randomly | tee formats.log
          passed=$(grep -c ' PASSED' formats.log || true)
          if [ "$passed" -lt 358 ] || grep -Eq '^SKIPPED \[|^=+ .*[0-9]+ skipped|^=+ .*no tests ran' formats.log; then
            echo "::error::Both storage formats must run on SQLite and Postgres without skips."
            exit 1
          fi

      - name: Coverage leg name
        id: leg
        shell: bash
        run: |
          sqlalchemy="${{ matrix.sqlalchemy-version }}"
          echo "name=py${{ matrix.python-version }}-sa${sqlalchemy%.*}" >> "$GITHUB_OUTPUT"

      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ steps.leg.outputs.name }}-${{ matrix.shard }}
          path: packages/python/cov-${{ matrix.shard }}.data
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Build and smoke-test distributions
        if: matrix.shard == 1
        run: python scripts/mcp_distribution_smoke.py

  # Combine each leg's four shards with both real MySQL-family reports before judging CRAP.
  python-coverage:
    name: coverage py${{ matrix.python-version }} / SQLAlchemy ${{ matrix.sqlalchemy-version }}
    needs: [python, mysql-family]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        sqlalchemy-version: ["2.0.*", "2.1.*"]
        exclude:
          - python-version: "3.12"
            sqlalchemy-version: "2.0.*"

    env:
      PYTHON_DOTENV_DISABLED: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/python/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Coverage leg name
        id: leg
        shell: bash
        run: |
          sqlalchemy="${{ matrix.sqlalchemy-version }}"
          echo "name=py${{ matrix.python-version }}-sa${sqlalchemy%.*}" >> "$GITHUB_OUTPUT"

      - name: Download coverage data
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-${{ steps.leg.outputs.name }}-*
          path: packages/python
          merge-multiple: true

      - name: Download MySQL coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-mysql
          path: packages/python

      - name: Download MariaDB coverage
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage-mariadb
          path: packages/python

      # Every shard and backend must be present; never silently judge partial coverage.
      - name: Combine coverage and apply the floor
        shell: bash
        run: |
          for shard in 1 2 3 4; do test -s "cov-$shard.data"; done
          test -s cov-mysql.data
          test -s cov-mariadb.data
          coverage combine --keep cov-{1,2,3,4}.data cov-mysql.data cov-mariadb.data
          coverage report --show-missing --fail-under=80
          coverage json -o coverage.json

      # Tie coverage.json to the source it measured; the ratchet rejects a stale report.
      - name: Record coverage source digests
        if: matrix.python-version == '3.12' && matrix.sqlalchemy-version == '2.1.*'
        run: python tools/crap_ratchet.py stamp --coverage coverage.json --mysql-coverage

      # Coverage is the same on every leg, so one leg judges it. Enforcing: a new function
      # over the threshold, or an existing one whose CRAP score rises, fails the build.
      - name: CRAP ratchet
        id: crap
        if: matrix.python-version == '3.12' && matrix.sqlalchemy-version == '2.1.*'
        run: python tools/crap_ratchet.py check --coverage coverage.json --ci

      - name: Upload CRAP debt summary
        if: always() && steps.crap.outcome != 'skipped'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: crap-debt-${{ steps.leg.outputs.name }}
          path: packages/python/coverage.json.crap.json
          if-no-files-found: error
          retention-days: 7

  # Benchmarks: tests that assert how fast something is (marked benchmark, or listed in
  # tests/_helpers/tier_lists/benchmark.txt). They fail under the parallel load of the shard jobs,
  # so they run here on their own, in one process, on a single leg. Blocking, like the shards.
  # Not part of the combined coverage. A failed timing retries once (shared runners vary); a real
  # slowdown fails both tries.
  benchmarks:
    name: benchmarks (python 3.12 / SQLAlchemy 2.1)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: packages/python

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dendrux
          POSTGRES_PASSWORD: dendrux
          POSTGRES_DB: dendrux_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dendrux"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHON_DOTENV_DISABLED: "1"
      DENDRUX_TEST_PG_URL: postgresql+asyncpg://dendrux:dendrux@localhost:5432/dendrux_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/python/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev,all]"

      - name: Install pinned NLP test model
        run: make test-model-install

      - name: Pin SQLAlchemy 2.1.*
        run: |
          pip install "sqlalchemy[asyncio]==2.1.*"
          python -c "import sqlalchemy; print('SQLAlchemy', sqlalchemy.__version__)"

      - name: Benchmarks
        shell: bash
        run: |
          pytest tests/ -v -rs -n 0 -m benchmark --no-cov --reruns 1 | tee pytest.log
          if grep -Eq '^SKIPPED \[[0-9]+\].*DENDRUX_TEST_PG_URL not set' pytest.log; then
            echo "::error::Postgres benchmarks were skipped (DENDRUX_TEST_PG_URL not set)."
            exit 1
          fi

  # The Redis suites on the older redis-py releases the `redis` extra allows (5.0.1 to 7.4.0).
  # RedisUpdates leans on redis-py internals for its message bound and proves them at run time;
  # this keeps that proof honest across releases. 8.1.0 (the dev pin) runs in every other job.
  redis-compat:
    name: redis-py ${{ matrix.redis }} suites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/python
    strategy:
      fail-fast: false
      matrix:
        redis: ["5.0.1", "5.3.1", "6.4.0", "7.4.0"]

    services:
      redis:
        image: redis:7@sha256:b6b6e3dc0c0952737748e55d5d885272840c7e42ba41ab1d5489f693419882f5
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHON_DOTENV_DISABLED: "1"
      DENDRUX_TEST_REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/python/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Pin redis-py ${{ matrix.redis }}
        run: |
          pip install "redis==${{ matrix.redis }}"
          python -c "import redis; assert redis.__version__ == '${{ matrix.redis }}', redis.__version__"

      - name: Redis suites on redis-py ${{ matrix.redis }}
        shell: bash
        run: |
          pytest tests/unit/test_redis_updates*.py tests/integration/test_redis_updates.py -n 0 --no-cov -v -rs -p no:randomly | tee pytest.log
          if grep -Eq '^SKIPPED \[|^=+ .*[0-9]+ skipped' pytest.log; then
            echo "::error::Redis compatibility tests were skipped."
            exit 1
          fi

  # Quality ratchets (packages/python/tools/QUALITY.md): cognitive complexity, duplicate code,
  # dead code, import cycles and the custom Semgrep rules. Each compares with a committed
  # baseline and fails only on a new problem or an existing one getting worse. The CRAP ratchet
  # needs the test coverage, so it runs in the python job above.
  quality:
    name: quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/python

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packages/python/pyproject.toml
            packages/python/tools/semgrep-requirements.txt

      # complexipy, pylint and vulture come from the dev extra (exact pins). Semgrep is a
      # CI/dev tool only; it is not a dependency of the published package.
      - name: Install dependencies
        run: |
          pip install -e ".[dev]"
          pip install -r tools/semgrep-requirements.txt

      - name: Cognitive complexity
        run: python tools/cognitive_ratchet.py check

      - name: Duplicate code
        run: python tools/duplicate_ratchet.py check

      - name: Dead code
        run: python tools/vulture_ratchet.py check

      - name: Import cycles
        run: python tools/import_cycles.py check

      # Information only: where function-level imports hide coupling.
      - name: Import cycles including function-level imports (report)
        run: python tools/import_cycles.py report

      - name: Semgrep rule fixtures
        run: python tools/semgrep_ratchet.py test

      - name: Semgrep rules
        run: python tools/semgrep_ratchet.py check

  # MySQL 8.4 and MariaDB 10.11: schema, maintenance and store suites. The servers come from
  # the committed compose file (CI parity with `make test-dbs-up`); GitHub service containers
  # cannot pass the NO PAD collation flags. The job fails if the server's tests were skipped.
  mysql-family:
    name: ${{ matrix.server }} suites
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: packages/python
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: mysql
            env_name: DENDRUX_TEST_MYSQL_URL
            port: 53306
          - server: mariadb
            env_name: DENDRUX_TEST_MARIADB_URL
            port: 53307

    env:
      PYTHON_DOTENV_DISABLED: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/python/pyproject.toml

      - name: Start ${{ matrix.server }}
        run: docker compose -f docker/test-dbs.compose.yml up -d --wait ${{ matrix.server }}

      - name: Install dependencies
        run: pip install -e ".[dev,mysql]"

      - name: Test on ${{ matrix.server }}
        shell: bash
        env:
          SERVER_URL: mysql+asyncmy://root:dendrux_test@127.0.0.1:${{ matrix.port }}/dendrux_ci_test
          COVERAGE_FILE: cov-${{ matrix.server }}.data
        run: |
          export ${{ matrix.env_name }}="$SERVER_URL"
          python -c "import asyncmy"
          pytest tests/db \
            tests/unit/test_sql_store_contract.py \
            tests/unit/test_sql_store_rx_errors.py \
            tests/integration/test_mysql_store_errors.py \
            -v -rs -n 4 -m "not benchmark" --cov=src/dendrux --cov-report= | tee pytest.log
          if grep -q '${{ matrix.env_name }} not set' pytest.log; then
            echo "::error::${{ matrix.server }} tests were skipped (${{ matrix.env_name }} not set)."
            exit 1
          fi

      # The kit's live-update contract on this server (the conformance harness makes a private
      # database per test). Needs live_updates= on the stores (track A2); a skip fails the job.
      - name: Store kit live-update contract on ${{ matrix.server }}
        shell: bash
        env:
          SERVER_URL: mysql+asyncmy://root:dendrux_test@127.0.0.1:${{ matrix.port }}/dendrux_ci_test
        run: |
          export ${{ matrix.env_name }}="$SERVER_URL"
          pytest tests/conformance/test_store_kit.py -k "test_live_ and ${{ matrix.server }}" -n 0 --no-cov -v -rs -p no:randomly | tee kit-live.log
          passed=$(grep -c ' PASSED' kit-live.log || true)
          if [ "$passed" -lt 7 ] || grep -Eq '^SKIPPED \[|^=+ .*[0-9]+ skipped|^[[:space:]]*live updates: not tested|^=+ .*no tests ran' kit-live.log; then
            echo "::error::The live-update kit contract must pass 7 times on ${{ matrix.server }} and skip never (got $passed passed)."
            exit 1
          fi

      - name: Upload coverage data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-${{ matrix.server }}
          path: packages/python/cov-${{ matrix.server }}.data
          if-no-files-found: error
          retention-days: 1

      - name: Pause-summary contract on ${{ matrix.server }}
        shell: bash
        env:
          SERVER_URL: mysql+asyncmy://root:dendrux_test@127.0.0.1:${{ matrix.port }}/dendrux_ci_test
        run: |
          export ${{ matrix.env_name }}="$SERVER_URL"
          pytest tests/conformance/test_pause_summary_formats.py -k "${{ matrix.server }}" -n 0 --no-cov -v -rs -p no:randomly | tee pause-summary.log
          passed=$(grep -c ' PASSED' pause-summary.log || true)
          if [ "$passed" -lt 3 ] || grep -Eq '^SKIPPED \[|^=+ .*[0-9]+ skipped|^=+ .*no tests ran' pause-summary.log; then
            echo "::error::Both pause-summary versions and public trace paging must run without skips."
            exit 1
          fi

      - name: Remove ${{ matrix.server }}
        if: always()
        run: docker compose -f docker/test-dbs.compose.yml down -v

  api-compat:
    name: public API vs the last release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release tag must be in the clone for griffe to read it.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # griffe reads source statically, so the package itself is not installed.
      # Keep the standalone checker in step with the pyproject.toml dev pin.
      - name: Install griffe
        run: pip install "griffe==2.4.1"

      - name: Compare the public API with v0.5.0
        run: python packages/python/tools/api_breaks.py --against v0.5.0
