name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: the jobs only read the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    name: python ${{ matrix.python-version }} / SQLAlchemy ${{ matrix.sqlalchemy-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: packages/python
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
        # pyproject allows sqlalchemy>=2.0,<3.0: test both minors. 2.1 on every
        # Python, 2.0 on the oldest and newest only (5 jobs).
        sqlalchemy-version: ["2.0.*", "2.1.*"]
        exclude:
          - python-version: "3.12"
            sqlalchemy-version: "2.0.*"

    services:
      # Postgres backend matrix — integration tests parametrize across
      # [sqlite, postgres] via the DENDRUX_TEST_PG_URL env var. Without
      # this service the PG branch is skipped (locally fine, in CI not
      # acceptable — that's how the original tz-naive bug shipped). The
      # "Require the Postgres backend" and "Test" steps below fail the job if
      # the variable goes missing or any test is skipped for lack of it.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dendrux
          POSTGRES_PASSWORD: dendrux
          POSTGRES_DB: dendrux_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dendrux"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHON_DOTENV_DISABLED: "1"
      DENDRUX_TEST_PG_URL: postgresql+asyncpg://dendrux:dendrux@localhost:5432/dendrux_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: packages/python/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev,all]"

      # Presidio loads this model by default. Install it once before workers.
      - name: Install pinned NLP test model
        run: make test-model-install

      - name: Pin SQLAlchemy ${{ matrix.sqlalchemy-version }}
        run: |
          pip install "sqlalchemy[asyncio]==${{ matrix.sqlalchemy-version }}"
          python -c "import sqlalchemy; print('SQLAlchemy', sqlalchemy.__version__)"

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Type check
        run: mypy src/dendrux/

      - name: Architecture rules
        run: lint-imports

      - name: Require the Postgres backend
        shell: bash
        run: |
          if [ -z "${DENDRUX_TEST_PG_URL:-}" ]; then
            echo "::error::DENDRUX_TEST_PG_URL is not set; the Postgres test matrix would be skipped silently."
            exit 1
          fi

      - name: Test
        shell: bash
        run: |
          # Benchmarks (marked benchmark) depend on the machine; `make bench` runs them.
          pytest tests/ -v -rs -n auto -m "not benchmark" --cov=src/dendrux --cov-report=term-missing --cov-report=json:coverage.json --cov-fail-under=80 | tee pytest.log
          if grep -q 'DENDRUX_TEST_PG_URL not set' pytest.log; then
            echo "::error::Postgres integration tests were skipped (DENDRUX_TEST_PG_URL not set)."
            exit 1
          fi

      # Tie coverage.json to the source it measured; the ratchet rejects a stale report.
      - name: Record coverage source digests
        if: matrix.python-version == '3.12' && matrix.sqlalchemy-version == '2.1.*'
        run: python tools/crap_ratchet.py stamp --coverage coverage.json

      # Coverage is the same on every leg, so one leg judges it.
      - name: CRAP ratchet
        if: matrix.python-version == '3.12' && matrix.sqlalchemy-version == '2.1.*'
        run: python tools/crap_ratchet.py check --report-only --coverage coverage.json

      - name: Build and smoke-test distributions
        run: python scripts/mcp_distribution_smoke.py

  # MySQL 8.4 and MariaDB 10.11: schema, maintenance and store suites. The servers come from
  # the committed compose file (CI parity with `make test-dbs-up`); GitHub service containers
  # cannot pass the NO PAD collation flags. The job fails if the server's tests were skipped.
  mysql-family:
    name: ${{ matrix.server }} suites
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: packages/python
    strategy:
      fail-fast: false
      matrix:
        include:
          - server: mysql
            env_name: DENDRUX_TEST_MYSQL_URL
            port: 53306
          - server: mariadb
            env_name: DENDRUX_TEST_MARIADB_URL
            port: 53307

    env:
      PYTHON_DOTENV_DISABLED: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: packages/python/pyproject.toml

      - name: Start ${{ matrix.server }}
        run: docker compose -f docker/test-dbs.compose.yml up -d --wait ${{ matrix.server }}

      - name: Install dependencies
        run: pip install -e ".[dev,mysql]"

      - name: Test on ${{ matrix.server }}
        shell: bash
        env:
          SERVER_URL: mysql+asyncmy://root:dendrux_test@127.0.0.1:${{ matrix.port }}/dendrux_ci_test
        run: |
          export ${{ matrix.env_name }}="$SERVER_URL"
          pytest tests/db -v -rs -n 4 -m "not benchmark" --no-cov | tee pytest.log
          if grep -q '${{ matrix.env_name }} not set' pytest.log; then
            echo "::error::${{ matrix.server }} tests were skipped (${{ matrix.env_name }} not set)."
            exit 1
          fi

      - name: Remove ${{ matrix.server }}
        if: always()
        run: docker compose -f docker/test-dbs.compose.yml down -v

  api-compat:
    name: public API vs the last release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release tag must be in the clone for griffe to read it.
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # griffe reads source statically, so the package itself is not installed.
      - name: Install griffe
        run: pip install "griffe>=1.5,<3.0"

      - name: Compare the public API with v0.4.1
        run: python packages/python/tools/api_breaks.py --against v0.4.1
