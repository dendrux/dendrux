<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Dendrux developer routes demo</title>
<style>
body { font: 16px system-ui; max-width: 800px; margin: 3rem auto; padding: 1rem; }
input, textarea, select, button { font: inherit; margin: .4rem; padding: .5rem; }
textarea { display: block; width: 90%; min-height: 80px; }
pre { white-space: pre-wrap; overflow-wrap: anywhere; background: #eee; padding: 1rem; }
</style>
<h1>Developer-owned client tools</h1>
<label>App token <input id="token" type="password" value="dev-secret-abc"></label>
<label>Provider <select id="provider"><option>anthropic</option></select></label>
<textarea id="input" placeholder="Ask the agent to use a tool"></textarea>
<button id="start">Start</button>
<label>Recover run <input id="run"></label><button id="recover">Get pending</button>
<pre id="status">Ready</pre>
<section id="pause" hidden>
<pre id="calls"></pre>
<textarea id="result" placeholder="Client tool result (a client assertion)"></textarea>
<button id="submit">Submit tool results</button>

</section>
<script>
let runId = null;
let currentPause = null;
const el = id => document.getElementById(id);
async function api(path, body) {
  const headers = {"X-App-Token": el("token").value};
  if (body !== undefined) headers["Content-Type"] = "application/json";
  const response = await fetch(path, {method: body === undefined ? "GET" : "POST",
    headers, ...(body === undefined ? {} : {body: JSON.stringify(body)})});
  if (!response.ok) throw new Error(`HTTP ${response.status}: ${await response.text()}`);
  return response.json();
}
async function pending() {
  currentPause = await api(`/runs/${encodeURIComponent(runId)}/pending`);
  el("pause").hidden = !currentPause;
  if (!currentPause) return;
  el("calls").textContent = JSON.stringify(currentPause, null, 2);
  const hidden = (currentPause.pending_tool_calls || []).some(call => call.args_hidden);
  el("submit").hidden = currentPause.kind !== "client_tool";
  for (const id of ["approve", "reject"]) {
    if (el(id)) el(id).hidden = currentPause.kind !== "approval" || hidden;
  }
  if (hidden) el("status").textContent = "Arguments unavailable. Request server-side resolution.";
}
async function showResult(data) {
  runId = data.run_id;
  el("run").value = runId;
  el("status").textContent = JSON.stringify(data, null, 2);
  await pending();
}
async function action(work) {
  for (const button of document.querySelectorAll("button")) button.disabled = true;
  try { await work(); }
  catch (error) {
    el("status").textContent = error.message + " Re-fetch pending before deciding again.";
    el("pause").hidden = true;
  } finally {
    for (const button of document.querySelectorAll("button")) button.disabled = false;
  }
}
el("start").onclick = () => action(async () => showResult(await api("/chat", {
  input: el("input").value, provider: el("provider").value,
})));
el("recover").onclick = () => action(async () => {
  runId = el("run").value.trim();
  await pending();
});
el("submit").onclick = () => action(async () => {
  const results = currentPause.pending_tool_calls.map(call => ({
    tool_call_id: call.id, tool_name: call.name, payload: JSON.stringify(el("result").value),
  }));
  await showResult(await api(`/runs/${encodeURIComponent(runId)}/tool-results`, {results}));
});

</script>
</html>
