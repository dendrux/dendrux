[project]
name = "dendrux"
version = "0.6.1"
description = "The runtime for agents that act in the real world."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
authors = [
    { name = "Dendrux Contributors" },
]
keywords = ["agents", "llm", "ai", "tools", "runtime"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Typing :: Typed",
]

dependencies = [
    "pydantic>=2.0,<3.0",
    "typer>=0.12,<1.0",
    "rich>=13.0,<15.0",
    "python-ulid>=2.0,<4.0",
    "pyyaml>=6.0,<7.0",
    # SQLAlchemy is the default (and currently only built-in) StateStore
    # backend. Imported at module load by runtime/state.py, so it must
    # be a hard dependency until/unless we ship a non-SQLAlchemy backend.
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "aiosqlite>=0.19,<1.0",
    "alembic>=1.13,<2.0",
    # httpx is imported at module load on the core import path
    # (llm/_retry_telemetry.py, pulled in via loops). It must be a hard
    # dependency so `import dendrux` works without a provider extra — e.g.
    # a read-only consumer using RunStore.
    "httpx>=0.27,<1.0",
    # Imported directly by tools/_typing.py (Python 3.11 TypedDict support).
    "typing_extensions>=4.6.1,<5",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.77.0,<1.0"]
openai = ["openai>=1.97.2,<3.0"]
# OpenRouter rides the OpenAI-compatible transport — alias for discoverability.
openrouter = ["dendrux[openai]"]
# `db` is kept as an empty alias for backwards compatibility with anyone
# who already depends on `dendrux[db]`. SQLAlchemy + aiosqlite + alembic
# are now hard dependencies.
db = []
postgres = ["asyncpg>=0.29,<1.0"]
# MySQL 8.4 / MariaDB 10.11 driver. Opt-in: deliberately not part of `all`, because the
# driver is a compiled extension that only MySQL and MariaDB deployments need.
# `cryptography` is needed by asyncmy for MySQL 8.4's default caching_sha2_password login.
mysql = ["asyncmy>=0.2.10", "cryptography>=42"]
# Redis Pub/Sub live updates (dendrux.db._redis_updates.RedisUpdates). Opt-in: deliberately not
# part of `all`; only deployments that announce changes over Redis need the client.
redis = ["redis>=5.0.1,<9"]
# Dependencies of the store test kit (pytest plugin, dendrux.testing.store_kit).
testkit = ["pytest>=8.0,<10.0", "pytest-asyncio>=0.23,<2.0"]
mcp = ["mcp>=2.2,<3.0", "httpx2>=2.9.1,<3.0", "httpcore2>=2.9.1,<3.0"]
# NLP-backed PII detection. Requires spaCy model:
#   python -m spacy download en_core_web_lg
presidio = ["presidio-analyzer>=2.2,<3"]
otel = ["opentelemetry-api>=1.30,<2.0"]
all = ["dendrux[anthropic,openai,postgres,mcp,presidio,otel]"]
# Direct development tools and test support are pinned to the CI toolchain.
# Runtime dependency ranges above stay independent; see tools/QUALITY.md.
dev = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "build==1.6.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "pytest-cov==7.1.0",
    "coverage==7.17.0",
    # Random order and parallel runs: both are on for every test run.
    "pytest-randomly==5.0.0",
    "pytest-xdist==3.8.0",
    # Fast loop (make test-fast) and the flaky quarantine. See tools/QUALITY.md, "Test tiers".
    "pytest-testmon==2.2.0",
    "pytest-rerunfailures==16.7",
    # Quality gates (see tools/ and .importlinter).
    "radon==6.0.1",
    # Quality ratchets compare against committed baselines. Tool upgrades are deliberate;
    # only the coordinator may stamp baseline decreases.
    # Semgrep is pinned in tools/semgrep-requirements.txt (it clashes with the mcp extra).
    "complexipy==8.3.0",
    "pylint==4.1.3",
    "vulture==2.16",
    "griffe==2.4.1",
    "import-linter==2.15",
    # Keep in step with .pre-commit-config.yaml (rev: v0.15.17).
    "ruff==0.15.17",
    "mypy==1.20.2",
    "types-PyYAML==6.0.12.20261030",
    "python-dotenv==1.2.4",
    "twine==6.2.0",
    "dendrux[otel]",
    "opentelemetry-sdk==1.45.2",
    # Real-Redis tests of RedisUpdates (DENDRUX_TEST_REDIS_URL); the extra stays out of `all`.
    "redis==8.1.0",
]

[project.scripts]
dendrux = "dendrux.cli.main:app"

# The store test kit as a pytest plugin. It collects nothing until `-p dendrux.testing.store_kit`,
# `--dendrux-store-kit` or `dendrux_store_kit = true` switches it on. The entry-point name is the
# module path on purpose: pluggy refuses one module registered under two names, so any other name
# would break `pytest -p dendrux.testing.store_kit`. The target is a top-level module outside the
# `dendrux` package so that an inactive kit never imports `dendrux` in other pytest sessions.
[project.entry-points.pytest11]
"dendrux.testing.store_kit" = "_dendrux_store_kit_bootstrap"

[project.urls]
Homepage = "https://github.com/dendrux/dendrux"
Repository = "https://github.com/dendrux/dendrux"

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dendrux"]
# Keep upload tooling compatible while Core Metadata 2.5 adoption is incomplete.
core-metadata-version = "2.4"

[tool.hatch.build.targets.wheel.force-include]
"src/_dendrux_store_kit_bootstrap.py" = "_dendrux_store_kit_bootstrap.py"

# Explicit allowlist so the sdist is deterministic: only these paths ship,
# regardless of untracked working-tree files. Without it, hatchling's default
# sweeps in anything not gitignored (e.g. session logs, generated example
# output). The `output` exclude guards example runs that write in-tree.
[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
    "src",
    "examples",
    "CHANGELOG.md",
    "README.md",
    "LICENSE",
    "alembic.ini",
    "Makefile",
]
exclude = [
    "**/output",
]

# --- Tool configs ---

[tool.ruff]
line-length = 100
target-version = "py311"
# .semgrep/dendrux.py is a Semgrep rule fixture (undefined names on purpose).
extend-exclude = ["src/dendrux/db/migrations", ".semgrep"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
]

[tool.ruff.lint.isort]
known-first-party = ["dendrux"]

[tool.mypy]
strict = true
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = "anthropic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "openai.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "sqlalchemy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "aiosqlite.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "alembic.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "uvicorn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "mcp.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "presidio_analyzer.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "redis.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "dendrux.db.migrations.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "benchmark: environment-dependent Postgres measurements (HOT statistics, writer stall during a 300k-row migration); excluded from make test, make ci and CI, run with make bench on a quiet machine",
]

[tool.coverage.run]
# Also read when the shards' coverage data is combined in CI (coverage report), where it makes
# modules that no test imported count as uncovered, exactly like `pytest --cov=src/dendrux`.
source = ["src/dendrux"]
omit = [
    "src/dendrux/db/migrations/*",
]
