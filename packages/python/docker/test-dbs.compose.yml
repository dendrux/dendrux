# Test servers for the MySQL 8.4 and MariaDB 10.11 suites and the Redis live-updates suite
# (CI uses this same file).
#
#   make test-dbs-up      # start all three, wait until healthy
#   DENDRUX_TEST_MYSQL_URL=mysql+asyncmy://root:dendrux_test@127.0.0.1:53306/dendrux_test \
#   DENDRUX_TEST_MARIADB_URL=mysql+asyncmy://root:dendrux_test@127.0.0.1:53307/dendrux_test \
#     make test-mysql
#   make test-dbs-down    # stop and remove all of them (and their data)
#
#   make test-redis-up    # only Redis: DENDRUX_TEST_REDIS_URL=redis://127.0.0.1:56379/0 make test-redis
#   make test-redis-down
#
# Only these three containers are ever touched. They listen on 127.0.0.1 only, are capped
# at 1 GB each (Redis 256 MB), and use the NO PAD binary collations Dendrux requires as server
# defaults (the schema sets them per column too). Data is disposable: no named volumes.
name: dendrux-test-dbs

services:
  mysql:
    image: mysql:8.4@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
    container_name: dendrux-test-mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_bin
    environment:
      MYSQL_ROOT_PASSWORD: dendrux_test
    ports:
      - "127.0.0.1:53306:3306"
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pdendrux_test"]
      interval: 3s
      timeout: 3s
      retries: 40

  mariadb:
    image: mariadb:10.11@sha256:d769e37960821dfdcf096954f6e7ac89f747e116c1bba98e48edd265dfc7deae
    container_name: dendrux-test-mariadb
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_nopad_bin
    environment:
      MARIADB_ROOT_PASSWORD: dendrux_test
    ports:
      - "127.0.0.1:53307:3306"
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 3s
      retries: 40

  redis:
    image: redis:7@sha256:b6b6e3dc0c0952737748e55d5d885272840c7e42ba41ab1d5489f693419882f5
    container_name: dendrux-test-redis
    # Pub/Sub only: nothing is persisted, and a runaway publisher cannot grow the server.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb"]
    ports:
      - "127.0.0.1:56379:6379"
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 40
